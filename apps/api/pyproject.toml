[project]
name = "applicationos-api"
version = "0.1.0"
description = "FastAPI backend for ApplicationOS"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0",
  "uvicorn[standard]>=0.32.0,<1.0",
  "pydantic>=2.9.0,<3.0",
  "pydantic-settings>=2.6.0,<3.0",
  "sqlalchemy>=2.0.36,<3.0",
  "psycopg[binary]>=3.2.3,<4.0",
  "alembic>=1.14.0,<2.0",
  "pgvector>=0.3.6,<1.0",
  "langgraph>=0.2.50,<1.0",
  "langgraph-checkpoint-postgres>=2.0.0,<3.0",
  "httpx>=0.28.0,<1.0",
  "python-multipart>=0.0.17,<1.0",
  "PyMuPDF>=1.24.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0",
  "pytest-asyncio>=0.24.0,<1.0",
  "ruff>=0.8.0,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
