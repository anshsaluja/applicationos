name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: applicationos
          POSTGRES_PASSWORD: applicationos
          POSTGRES_DB: applicationos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applicationos -d applicationos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://applicationos:applicationos@localhost:5432/applicationos
      # Isolated disposable PostgreSQL service used by integration tests.
      TEST_DATABASE_URL: postgresql+psycopg://applicationos:applicationos@localhost:5432/applicationos
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and dev dependencies
        run: pip install -e '.[dev]'
      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check . --output-format github
      - name: Prepare PostgreSQL schema
        run: |
          python - <<'PY'
          from app.persistence import Base, build_engine

          engine = build_engine()
          try:
              with engine.begin() as connection:
                  connection.exec_driver_sql("CREATE EXTENSION IF NOT EXISTS vector")
              Base.metadata.create_all(bind=engine)
          finally:
              engine.dispose()
          PY
      - name: Test
        run: pytest -q
      - name: HTTP document-to-synthetic-completion smoke (real PostgreSQL)
        env:
          # Disposable test-only credential; not a production secret or deployment setting.
          APPLICATIONOS_REVIEW_TOKEN: ci-synthetic-review-token-not-for-deployment
          APPLICATIONOS_REVIEWER_ID: ci-synthetic-reviewer
          APPLICATIONOS_SMOKE_REVIEW_TOKEN: ci-synthetic-review-token-not-for-deployment
          APPLICATIONOS_SMOKE_SYNTHETIC_EXECUTION: local-only
        run: |
          set -Eeuo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/applicationos-api-smoke.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            if [ -f /tmp/applicationos-api-smoke.log ]; then
              tail -n 80 /tmp/applicationos-api-smoke.log
            fi
          }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI did not become healthy within 60 seconds")
          PY
          APPLICATIONOS_SMOKE_API_URL=http://127.0.0.1:8000 python ../../scripts/smoke_local_journey.py
      - name: Enforce lint gate
        if: always()
        run: |
          if [ '${{ steps.lint.outcome }}' != 'success' ]; then
            echo 'API lint did not pass; refusing green CI.' >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
