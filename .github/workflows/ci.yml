name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: applicationos
          POSTGRES_PASSWORD: applicationos
          POSTGRES_DB: applicationos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applicationos -d applicationos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://applicationos:applicationos@localhost:5432/applicationos
      # Isolated disposable PostgreSQL service used by integration tests.
      TEST_DATABASE_URL: postgresql+psycopg://applicationos:applicationos@localhost:5432/applicationos
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and dev dependencies
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check . --output-format github
      - name: Prepare PostgreSQL schema
        run: |
          python - <<'PY'
          from app.persistence import Base, build_engine

          engine = build_engine()
          try:
              with engine.begin() as connection:
                  connection.exec_driver_sql("CREATE EXTENSION IF NOT EXISTS vector")
              Base.metadata.create_all(bind=engine)
          finally:
              engine.dispose()
          PY
      - name: Test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3
