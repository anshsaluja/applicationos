name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: applicationos
          POSTGRES_PASSWORD: applicationos
          POSTGRES_DB: applicationos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U applicationos -d applicationos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://applicationos:applicationos@localhost:5432/applicationos
      # Isolated disposable PostgreSQL service used by integration tests.
      TEST_DATABASE_URL: postgresql+psycopg://applicationos:applicationos@localhost:5432/applicationos
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API and dev dependencies
        run: pip install -e '.[dev]'
      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check . --output-format github
      - name: Prepare PostgreSQL schema
        run: |
          python - <<'PY'
          from app.persistence import Base, build_engine

          engine = build_engine()
          try:
              with engine.begin() as connection:
                  connection.exec_driver_sql("CREATE EXTENSION IF NOT EXISTS vector")
              Base.metadata.create_all(bind=engine)
          finally:
              engine.dispose()
          PY
      - name: Test
        run: pytest -q
      - name: HTTP document-to-synthetic-completion smoke (real PostgreSQL)
        env:
          # Disposable test-only credential; not a production secret or deployment setting.
          APPLICATIONOS_REVIEW_TOKEN: ci-synthetic-review-token-not-for-deployment
          APPLICATIONOS_REVIEWER_ID: ci-synthetic-reviewer
          APPLICATIONOS_SMOKE_REVIEW_TOKEN: ci-synthetic-review-token-not-for-deployment
          APPLICATIONOS_SMOKE_SYNTHETIC_EXECUTION: local-only
        run: |
          set -Eeuo pipefail
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/applicationos-api-smoke.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
            if [ -f /tmp/applicationos-api-smoke.log ]; then
              tail -n 80 /tmp/applicationos-api-smoke.log
            fi
          }
          trap cleanup EXIT
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          for attempt in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          break
              except (urllib.error.URLError, TimeoutError):
                  time.sleep(1)
          else:
              raise SystemExit("FastAPI did not become healthy within 60 seconds")
          PY
          # Liveness alone is insufficient: require a real PostgreSQL connection
          # before exercising the persisted document-to-execution journey.
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          # The API can become live before PostgreSQL is ready for connections.
          # Bound retries to 30 seconds; fail closed if readiness never succeeds.
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=2) as response:
                      if response.status == 200 and json.load(response) == {"status": "ready"}:
                          break
              except (urllib.error.URLError, TimeoutError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("PostgreSQL readiness did not succeed within 30 attempts")
          PY
          APPLICATIONOS_SMOKE_API_URL=http://127.0.0.1:8000 python ../../scripts/smoke_local_journey.py
      - name: Enforce lint gate
        if: always()
        run: |
          if [ '${{ steps.lint.outcome }}' != 'success' ]; then
            echo 'API lint did not pass; refusing green CI.' >&2
            exit 1
          fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for Playwright
        run: |
          set -Eeuo pipefail
          # Ubuntu package mirrors occasionally fail DNS resolution on hosted runners.
          # Retry transient setup failures, but never skip browser tests or mask failure.
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Chromium installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
      - name: Run browser regression tests
        run: npm run test:e2e
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 3

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Disposable credentials exist only inside the ephemeral CI stack.
      APPLICATIONOS_REVIEW_TOKEN: ci-compose-review-token-not-for-deployment
      APPLICATIONOS_REVIEWER_ID: ci-compose-reviewer
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start complete local stack
        run: docker compose up -d --wait --wait-timeout 300
      - name: Verify real frontend and API readiness
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8000/ready | grep -q '"ready"'
      - name: Enable pgvector in disposable PostgreSQL
        run: |
          docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Initialize disposable Compose PostgreSQL schema
        run: |
          # The API intentionally does not create tables on startup. Prepare the
          # disposable CI database explicitly, matching the API integration job.
          docker compose exec -T api python - <<'PY'
          from app.persistence import Base, build_engine

          engine = build_engine()
          try:
              Base.metadata.create_all(bind=engine)
          finally:
              engine.dispose()
          PY
      - name: Exercise document, requirements, and approval boundary against Compose PostgreSQL
        run: |
          docker compose exec -T \
            -e APPLICATIONOS_SMOKE_REVIEW_TOKEN="$APPLICATIONOS_REVIEW_TOKEN" \
            -e APPLICATIONOS_SMOKE_SYNTHETIC_EXECUTION=local-only \
            api python /workspace/scripts/smoke_local_journey.py
      - name: Run real-backend Playwright provenance journey
        env:
          APPLICATIONOS_REAL_E2E: '1'
          APPLICATIONOS_E2E_REVIEW_TOKEN: ci-compose-review-token-not-for-deployment
        run: |
          set -Eeuo pipefail
          cd apps/web
          npm install --no-audit --no-fund
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Chromium setup failed after three attempts" >&2
              exit 1
            fi
            sleep $((attempt * 15))
          done
          npx playwright test e2e/real-backend.spec.ts
      - name: Verify pgvector extension and persisted records
        run: |
          set -Eeuo pipefail
          docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT extname FROM pg_extension WHERE extname = 'vector'" | grep -qx vector
          docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) > 0 FROM documents" | grep -qx t
      - name: Verify API restart preserves PostgreSQL-backed workflows
        run: |
          set -Eeuo pipefail
          before=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM workflow_checkpoints")
          test "$before" -gt 0
          # Check document and requirement persistence as well as workflow state.
          documents_before=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM documents")
          requirements_before=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM requirements")
          test "$documents_before" -gt 0
          test "$requirements_before" -gt 0
          # Pin a real completed synthetic workflow, not just the row count.
          # A count-only assertion can pass even when the wrong record survives.
          action_id=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT action_id FROM workflow_checkpoints WHERE status = 'succeeded' ORDER BY action_id LIMIT 1")
          test -n "$action_id"
          status_before=$(curl --fail --silent --show-error "http://127.0.0.1:8000/v1/workflows/$action_id")
          printf '%s' "$status_before" | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "succeeded"'
          docker compose restart api
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:8000/ready | grep -q '"ready"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "API did not recover after restart" >&2
              exit 1
            fi
            sleep 2
          done
          after=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM workflow_checkpoints")
          test "$after" -eq "$before"
          documents_after=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM documents")
          requirements_after=$(docker compose exec -T postgres psql -U applicationos -d applicationos -v ON_ERROR_STOP=1 -Atc \
            "SELECT count(*) FROM requirements")
          test "$documents_after" -eq "$documents_before"
          test "$requirements_after" -eq "$requirements_before"
          # Read the exact pre-restart action through the restarted API.
          # The returned checkpoint must remain terminal and unchanged.
          status_after=$(curl --fail --silent --show-error "http://127.0.0.1:8000/v1/workflows/$action_id")
          test "$status_after" = "$status_before"
          # Replaying the original idempotent create after process restart must
          # resolve to the persisted terminal checkpoint, not create a new one.
          python3 - "$action_id" "$status_before" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request
          from uuid import uuid4

          action_id, original_json = sys.argv[1:]
          original = json.loads(original_json)
          key = original["idempotency_key"]
          def create(action, idem):
              payload = json.dumps({"action_id": action, "idempotency_key": idem}).encode()
              req = urllib.request.Request(
                  "http://127.0.0.1:8000/v1/workflows", data=payload,
                  headers={"Content-Type": "application/json"}, method="POST",
              )
              return urllib.request.urlopen(req, timeout=15)

          with create(action_id, key) as response:
              replay = json.load(response)
          assert replay["action_id"] == action_id, "Restart replay changed action identity"
          assert replay["status"] == "succeeded", "Restart replay lost terminal status"
          assert replay["idempotency_key"] == key, "Restart replay changed idempotency key"
          try:
              with create(str(uuid4()), key):
                  raise AssertionError("Restart allowed conflicting idempotency key")
          except urllib.error.HTTPError as exc:
              assert exc.code == 409, f"Expected 409 for conflicting replay, got {exc.code}"
          PY
          docker compose exec -T \
            -e APPLICATIONOS_SMOKE_REVIEW_TOKEN="$APPLICATIONOS_REVIEW_TOKEN" \
            -e APPLICATIONOS_SMOKE_SYNTHETIC_EXECUTION=local-only \
            api python /workspace/scripts/smoke_local_journey.py
      - name: Collect failure diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop and remove disposable stack
        if: always()
        run: docker compose down --volumes --remove-orphans
