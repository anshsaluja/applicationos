services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: applicationos
      POSTGRES_USER: applicationos
      POSTGRES_PASSWORD: applicationos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applicationos -d applicationos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    command: sh -c "pip install -e . && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - .:/workspace
    environment:
      DATABASE_URL: postgresql+psycopg://applicationos:applicationos@postgres:5432/applicationos
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 45s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/apps/web
    command: sh -c "npm install --no-audit --no-fund && npm run build && npm run start -- --hostname 0.0.0.0"
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/apps/web/node_modules
      - web_next:/workspace/apps/web/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  web_node_modules:
  web_next:
